<div class="col-lg-6 offset-lg-3">
<h3>Regisztráció</h3>
<p>Regisztráció</p>
<hr>

<div class="form-floating mb-3">
  <input type="text" class="form-control" id="name" placeholder="">
  <label for="name">Username</label>
</div>

<div class="form-floating mb-3">
  <input type="email" class="form-control" id="email" placeholder="name@example.com">
  <label for="email">Email address</label>
</div>

<div class="form-floating mb-3">
  <input type="password" class="form-control" id="password" placeholder="Password">
  <label for="password">Password</label>
</div>

<div class="form-floating mb-3">
  <input type="password" class="form-control" id="confirm" placeholder="">
  <label for="confirm">Confirm password</label>
</div>

<button type="button" class="btn btn-primary" onclick="registration()">Registration</button>
<p>Already had a account? <a href="#" onclick="navigate('users/login')">Sign in!</a></p>
</div>
