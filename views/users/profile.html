<div class="row">
    <h3>My Profile</h3>
    <hr>
    <div class="col-lg-6">
        <h6>Update Profile</h6>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="name" placeholder="">
            <label for="name">Username</label>
        </div>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="name@example.com">
            <label for="email">Email Address</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="role" readonly>
            <label for="role">Role</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="status" readonly>
            <label for="status">Status</label>
        </div>
        <button type="button" class="btn btn-primary mb-3" onclick="updateProfile()"><i class="bi bi-arrow-repeat"></i>&nbsp;&nbsp;Update Profile</button>
    </div>
    <div class="col-lg-6">
        <h6><i class="bi bi-key"></i> &nbsp;&nbsp;Change Password</h6>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="oldpass" placeholder="Old Password">
            <label for="oldpass">Old Password</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="newpass" placeholder="New Password">
            <label for="newpass">New Password</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="confirm" placeholder="Confirm Password">
            <label for="confirm">Confirm Password</label>
        </div>
        <button type="button" class="btn btn-primary mb-3" onclick="updatePassword()"><i class="bi bi-arrow-repeat"></i>&nbsp;&nbsp;Update Password</button>
    </div>
</div>
