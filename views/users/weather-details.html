<div class="col-lg-8 offset-lg-2">
<h3>Weather Details</h3>
<hr>
<div class="card">
    <div class="card-body">
        <h4 id="location">Location</h4>
        <p><strong>Date:</strong> <span id="date"></span></p>
        <p><strong>Minimum temperature:</strong><span id="temp_min"></span> °C</p>
        <p><strong>Maximum temperature:</strong><span id="temp_max"></span> °C</p>
        <p><strong>Weather type:</strong><span id="weather_type"></span></p>
        <p><strong>Precipitation:</strong><span id="precipitation"></span></p>
        <p><strong>Precipitation probability:</strong><span id="precipitation_probability"></span> %</p>
        <p><strong>Wind speed:</strong><span id="wind_speed"></span> km/h</p>
        <p><strong>Wind direction:</strong><span id="wind_direction"></span></p>
        <p><strong>Humidity:</strong><span id="humidity"></span> %</p>
        <p><strong>Pressure:</strong><span id="pressure"></span> hPa</p>
        <p><strong>UV Index:</strong><span id="uv_index"></span></p>
    </div>
</div>
<br>
<button class="btn btn-secondary" onclick="navigate('admin/forecasts')">Back</button>
</div>
