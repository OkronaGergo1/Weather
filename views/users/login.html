<div class="col-lg-6 offset-lg-3">
<h3>Login</h3>
<hr>

<div class="form-floating mb-3">
  <input type="email" class="form-control" id="email" placeholder="name@example.com">
  <label for="email">Email address</label>
</div>

<div class="form-floating mb-3">
  <input type="password" class="form-control" id="password" placeholder="Passwd">
  <label for="passwd">Password</label>
</div>

<button type="button" class="btn btn-primary mb-3" onclick="login()"><i class="bi bi-box-arrow-in-right"></i> Login</button>
<p>No account yet? <a href="#" onclick="navigate('users/register')">Sign up</a></p>
</div>
